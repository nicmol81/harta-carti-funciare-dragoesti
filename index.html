<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harta imobile - Carti Funciare Dragoesti</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; width: 100%; }
  .nrcad-label {
    background: none;
    border: none;
    box-shadow: none;
    font-weight: 700;
    font-size: 13px;
    color: #1a1a1a;
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  }
  .popup-table { font-size: 14px; line-height: 1.5; }
  .popup-table b { display: inline-block; min-width: 90px; }

  .search-box {
    background: #fff;
    padding: 6px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
  }
  .search-box input {
    width: 140px;
    font-size: 14px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }
  .search-box button {
    font-size: 14px;
    padding: 4px 8px;
    margin-left: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #f4f4f4;
    cursor: pointer;
  }
  .search-box button:hover { background: #e4e4e4; }
  .search-box .search-msg {
    font-size: 12px;
    color: #b00;
    margin-top: 4px;
    display: none;
  }
  .opacity-box label {
    font-size: 13px;
    margin-right: 4px;
  }
  .opacity-box select {
    font-size: 14px;
    padding: 3px 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }
  .labels-hidden .nrcad-label { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const map = L.map('map');

  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 20,
  });
  const satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 20,
    }
  );
  osmLayer.addTo(map);
  L.control.layers({ 'Harta (OSM)': osmLayer, 'Satelit': satelliteLayer }).addTo(map);

  const SearchControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const container = L.DomUtil.create('div', 'search-box');
      container.innerHTML =
        '<input type="text" id="nrcad-search" placeholder="Nr. cadastral" />' +
        '<button id="nrcad-search-btn">Cauta</button>' +
        '<div class="search-msg" id="nrcad-search-msg">Negasit</div>';
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);
      return container;
    },
  });
  map.addControl(new SearchControl());

  const OPACITY_BY_TRANSPARENCY = { '50': 0.5, '75': 0.25, '100': 0 };
  const OpacityControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const container = L.DomUtil.create('div', 'search-box opacity-box');
      container.innerHTML =
        '<label for="opacity-select">Transparenta</label>' +
        '<select id="opacity-select">' +
        '<option value="50" selected>50%</option>' +
        '<option value="75">75%</option>' +
        '<option value="100">100%</option>' +
        '</select>';
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);
      return container;
    },
  });
  map.addControl(new OpacityControl());

  const featuresByNrcad = {};

  function runSearch() {
    const input = document.getElementById('nrcad-search');
    const msg = document.getElementById('nrcad-search-msg');
    const nrcad = input.value.trim();
    const lyr = featuresByNrcad[nrcad];
    if (lyr) {
      msg.style.display = 'none';
      map.fitBounds(lyr.getBounds(), { maxZoom: 19, padding: [40, 40] });
      lyr.openPopup();
    } else {
      msg.style.display = 'block';
    }
  }

  fetch('data/imobile.geojson')
    .then(r => r.json())
    .then(data => {
      const layer = L.geoJSON(data, {
        style: {
          color: '#0000ff',
          weight: 2,
          fillColor: '#00ff00',
          fillOpacity: 0.5,
        },
        onEachFeature: (feature, lyr) => {
          const p = feature.properties;
          featuresByNrcad[p.nrcad] = lyr;
          lyr.bindTooltip(p.nrcad, {
            permanent: true,
            direction: 'center',
            className: 'nrcad-label',
          });
          lyr.bindPopup(
            `<div class="popup-table">` +
            `<b>Nr. cadastral:</b> ${p.nrcad || '-'}<br>` +
            `<b>Tarla:</b> ${p.tarla || '-'}<br>` +
            `<b>Intrav/extrav:</b> ${p.intrav || '-'}<br>` +
            `<b>Suprafata:</b> ${p.suprafata != null ? p.suprafata + ' mp' : '-'}` +
            `</div>`
          );
        },
      }).addTo(map);
      map.fitBounds(layer.getBounds(), { maxZoom: 18, padding: [20, 20] });

      const LABEL_MIN_ZOOM = 17;
      const updateLabelVisibility = () => {
        map.getContainer().classList.toggle('labels-hidden', map.getZoom() < LABEL_MIN_ZOOM);
      };
      map.on('zoomend', updateLabelVisibility);
      updateLabelVisibility();

      document.getElementById('nrcad-search-btn').addEventListener('click', runSearch);
      document.getElementById('nrcad-search').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runSearch();
      });

      document.getElementById('opacity-select').addEventListener('change', (e) => {
        layer.setStyle({ fillOpacity: OPACITY_BY_TRANSPARENCY[e.target.value] });
      });
    })
    .catch(err => {
      document.getElementById('map').innerHTML =
        '<p style="padding:20px">Eroare la incarcarea datelor: ' + err + '</p>';
    });
</script>
</body>
</html>
